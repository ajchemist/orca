name: Nightly macOS bundle

# Personal nightly pipeline (see NIGHTLY-PIPELINE.md on this branch).
# - schedule / plain dispatch: assemble upstream/main + the patch manifest
#   (.github/nightly-refs.txt) on the fly, build, upload the bundle artifact.
# - dispatch with `ref`: build that ref as-is (no assembly).
# This workflow lives ONLY on the fork's `nightly` branch so upstream PR
# branches stay clean.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Build this ref as-is (skips patch assembly)'
        required: false
        default: ''
  schedule:
    - cron: '30 18 * * *' # 03:30 KST

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # 'true' when the self-signed cert secrets are configured (see
      # NIGHTLY-PIPELINE.md §3): the bundle is then signed as "Orca Local Dev"
      # so macOS TCC grants survive across nightly rebuilds.
      HAS_SIGNING_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Assemble upstream main + patch manifest
        if: ${{ inputs.ref == '' }}
        env:
          UPSTREAM: https://github.com/stablyai/orca.git
          FORK: https://github.com/ajchemist/orca.git
        run: |
          set -euo pipefail
          git config user.name nightly-assembler
          git config user.email nightly-assembler@users.noreply.github.com
          # Manifest is read from the pipeline branch before switching bases.
          cp .github/nightly-refs.txt /tmp/nightly-refs.txt
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream main
          git checkout --detach upstream/main
          echo "base: $(git rev-parse --short=12 HEAD) (upstream/main)"
          while IFS= read -r raw; do
            line="${raw%%#*}"
            line="$(echo "$line" | xargs || true)"
            [ -z "$line" ] && continue
            case "$line" in
              fork:*)     git fetch --no-tags "$FORK" "${line#fork:}" ;;
              upstream:*) git fetch --no-tags upstream "${line#upstream:}" ;;
              pr:*)       git fetch --no-tags upstream "pull/${line#pr:}/head" ;;
              *) echo "unknown manifest entry: $line" >&2; exit 1 ;;
            esac
            echo "::group::merge $line ($(git rev-parse --short=12 FETCH_HEAD))"
            git merge --no-ff --no-edit FETCH_HEAD \
              || { echo "MERGE CONFLICT on $line — rebase that patch branch onto upstream/main" >&2; exit 1; }
            echo "::endgroup::"
          done < /tmp/nightly-refs.txt
          echo "assembled: $(git rev-parse --short=12 HEAD)"

      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$MAC_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          # Why: electron-builder only uses "valid" identities; a self-signed cert
          # must be trusted for codeSign in the (disposable) runner's System
          # keychain or it silently falls back to ad-hoc (SuperCmd journal §3-3).
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -clcerts -nokeys -passin pass:"$MAC_CERT_PASSWORD" -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        # Why: merged patch branches can drift from the lockfile; fall back
        # to a full resolve instead of failing the nightly.
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build macOS bundle
        # Why: mirrors `pnpm run build:mac`, but the electron-builder call gains
        # --publish never — the repo config carries a github publish block, and
        # electron-builder's CI detection otherwise schedules an upload and
        # demands GH_TOKEN (SuperCmd journal, failure #2).
        run: |
          set -euo pipefail
          pnpm run build:desktop
          pnpm run build:computer-macos
          pnpm run build:notification-status-macos
          pnpm run ensure:electron-runtime
          ORCA_BUILD_COMMIT=$(git rev-parse --short=12 HEAD)
          ORCA_LOCAL_BUILD_VERSION=$(node --input-type=module -e "import('./config/scripts/build-mac-local.mjs').then(m => console.log(m.getLocalBuildIdentity().version))")
          export ORCA_BUILD_COMMIT ORCA_LOCAL_BUILD_VERSION
          echo "version: $ORCA_LOCAL_BUILD_VERSION"
          SIGN_ARGS=()
          if [ "$HAS_SIGNING_CERT" = "true" ]; then
            # Why: CSC_NAME also drives the config's own Computer Use /
            # notification helper signing hooks, so every TCC-relevant binary
            # carries the same stable identity.
            export CSC_NAME="Orca Local Dev"
            SIGN_ARGS=('-c.mac.identity=Orca Local Dev')
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm exec electron-builder --config config/electron-builder.config.cjs --mac --publish never "${SIGN_ARGS[@]}"

      - name: Verify signature identity
        if: env.HAS_SIGNING_CERT == 'true'
        run: |
          set -euo pipefail
          APP=$(ls -d dist/mac-arm64/*.app | head -1)
          codesign -dv "$APP" 2>&1 | grep -E "Authority=|Signature" || true
          codesign -dv "$APP" 2>&1 | grep -q "Authority=Orca Local Dev" \
            || { echo "bundle is NOT signed with Orca Local Dev" >&2; exit 1; }

      - name: Upload arm64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: orca-nightly-macos-arm64
          path: |
            dist/orca-macos-arm64.dmg
            dist/*arm64-mac.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload x64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: orca-nightly-macos-x64
          path: dist/orca-macos-x64.dmg
          if-no-files-found: warn
          retention-days: 14
